<header><h2>Video List</h2></header>

<button type="button" (click)="showDetails.update((v) => !v)">
  Toggle Details
</button>

@for (video of videos(); track video.id) {
  <button
    class="unstyled-button"
    (click)="pickVideo(video)"
    [class.highlighted]="video === chosenVideo()"
  >
    <ns-video-thumbnail
      [video]="video"
      [expanded]="showDetails()"
    />
  </button>
}
