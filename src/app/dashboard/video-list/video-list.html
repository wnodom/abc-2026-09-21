<header><h2>Video List</h2></header>

<button type="button" (click)="showDetails.update((v) => !v)">
  Toggle Details
</button>

@for (video of videos(); track video.id) {
  <button
    class="unstyled-button"
    (click)="currentVideo.set(video)"
    [class.highlighted]="video === currentVideo()"
  >
    <img
      [alt]="video.title"
      [src]="`http://img.youtube.com/vi/${video.id}/0.jpg`"
    />

    {{ video.title }}

    @if (showDetails()) {
      - {{ video.author | uppercase }}
    }
  </button>
}
